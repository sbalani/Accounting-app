# Minimal prefix routes, same Envoy version as pinned Supabase upstream.
# Protected routes rely on downstream JWT/RLS; reverse proxy MUST restrict
# this gateway to intended app and rate-limit requests before production.
static_resources:
  listeners:
    - name: api
      address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: accounting
                normalize_path: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                route_config:
                  name: accounting
                  virtual_hosts:
                    - name: accounting
                      domains: ['*']
                      cors:
                        allow_origin_string_match: [{exact: 'https://accounting.sharanbalani.com'}]
                        allow_methods: 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'
                        allow_headers: 'apikey,authorization,content-type,x-client-info,x-supabase-api-version,prefer,range,accept-profile,content-profile'
                        expose_headers: 'content-range,range'
                        max_age: '3600'
                      routes:
                        - match: {prefix: '/auth/v1/'}
                          route: {cluster: auth, prefix_rewrite: '/', timeout: 30s}
                        - match: {prefix: '/rest/v1/'}
                          route: {cluster: rest, prefix_rewrite: '/', timeout: 30s}
                        - match: {prefix: '/storage/v1/'}
                          route: {cluster: storage, prefix_rewrite: '/', timeout: 60s}
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: auth
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: auth, port_value: 9999}}}}]}]
    - name: rest
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: rest
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: rest, port_value: 3000}}}}]}]
    - name: storage
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: storage
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: storage, port_value: 5000}}}}]}]
